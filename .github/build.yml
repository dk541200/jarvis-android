name: Build Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Download official llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

      - name: Inject Jarvis source
        shell: bash
        run: |
          set -e

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          cp -R app/src/main/. "$TARGET/"

      - name: Configure Jarvis package
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          s = p.read_text()

          s = s.replace(
              'namespace = "com.arm.aichat"',
              'namespace = "com.jarvis.android"'
          )

          s = s.replace(
              'applicationId = "com.arm.aichat"',
              'applicationId = "com.jarvis.android"'
          )

          if 'namespace = "com.jarvis.android"' not in s:
              s = s.replace(
                  "android {",
                  'android {\n    namespace = "com.jarvis.android"',
                  1
              )

          if 'applicationId = "com.jarvis.android"' not in s:
              s = s.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        applicationId = "com.jarvis.android"',
                  1
              )

          p.write_text(s)

          print("Jarvis package configured successfully.")
          PY

      - name: Verify Jarvis source
        shell: bash
        run: |
          set -e

          echo "===== Jarvis source files ====="

          find /tmp/llama.cpp/examples/llama.android/app/src/main \
            -type f \
            -print

          echo ""
          echo "===== Checking forbidden old setup action ====="

          if grep -R "android-actions/setup-android" \
            .github/workflows 2>/dev/null; then
            echo "ERROR: Old setup-android action found in repository."
            exit 1
          fi

          echo "No old setup-android action found."

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== APK FILES ====="

          find /tmp/llama.cpp/examples/llama.android/app/build \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build and Release Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Download official llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

      - name: Extract Jarvis source
        shell: bash
        run: |
          set -e

          TEMP="/tmp/jarvis_extract"

          rm -rf "$TEMP"
          mkdir -p "$TEMP"

          if [ ! -f "jarvis-github-final.zip" ]; then
            echo "ERROR: jarvis-github-final.zip not found"
            exit 1
          fi

          unzip -q "jarvis-github-final.zip" -d "$TEMP"

          if [ -f "$TEMP/JarvisSource.zip" ]; then
            mkdir -p "$TEMP/jarvis_content"
            unzip -q "$TEMP/JarvisSource.zip" -d "$TEMP/jarvis_content"
          fi

          JARVIS_APP_DIR=$(find "$TEMP" \
            -type d \
            -path "*/app/src/main" \
            | head -n 1)

          if [ -z "$JARVIS_APP_DIR" ]; then
            echo "ERROR: app/src/main not found"
            find "$TEMP" -maxdepth 8 -print
            exit 1
          fi

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          cp -R "$JARVIS_APP_DIR"/. "$TARGET/"

          # IMPORTANT:
          # Only change Jarvis's old package.
          # DO NOT change com.arm.aichat.
          find "$TARGET" \
            -type f \
            \( -name "*.kt" -o -name "*.java" -o -name "*.xml" \) \
            -print0 |
          xargs -0 -r sed -i \
            -e 's/com\.example\.llama\.aichat/com.jarvis.android/g'

          mkdir -p "$TARGET/java/com/jarvis/android"

          find "$TARGET" \
            -type f \
            \( -name "MainActivity.kt" -o -name "JarvisService.java" \) \
            -print0 |
          while IFS= read -r -d '' file; do

            case "$file" in
              "$TARGET/java/com/jarvis/android/"*)
                ;;
              *)
                mv "$file" \
                  "$TARGET/java/com/jarvis/android/$(basename "$file")"
                ;;
            esac

          done

          echo "Jarvis source prepared."

      - name: Verify source
        shell: bash
        run: |
          set -e

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          test -f "$TARGET/AndroidManifest.xml"
          test -f "$TARGET/java/com/jarvis/android/MainActivity.kt"
          test -f "$TARGET/java/com/jarvis/android/JarvisService.java"

          grep -q \
            '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          grep -q \
            '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/JarvisService.java"

          if find "$TARGET" \
            -type f \
            \( -name "*.kt" -o -name "*.java" -o -name "*.xml" \) \
            -exec grep -l "com.example.llama.aichat" {} \; |
            grep -q .; then

            echo "ERROR: Old package still exists"
            exit 1
          fi

          echo "Source verification passed."

      - name: Configure Gradle
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          s = p.read_text()

          s = re.sub(
              r'(?m)^\s*namespace\s*=\s*"[^"]*"\s*$',
              '',
              s
          )

          s = re.sub(
              r'(?m)^\s*applicationId\s*=\s*"[^"]*"\s*$',
              '',
              s
          )

          if 'namespace = "com.jarvis.android"' not in s:
              s = s.replace(
                  "android {",
                  'android {\n    namespace = "com.jarvis.android"',
                  1
              )

          if 'applicationId = "com.jarvis.android"' not in s:
              s = s.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        applicationId = "com.jarvis.android"',
                  1
              )

          # NEVER replace com.arm.aichat.
          s = s.replace(
              "com.example.llama.aichat",
              "com.jarvis.android"
          )

          p.write_text(s)
          PY

          grep -q \
            'namespace = "com.jarvis.android"' \
            app/build.gradle.kts

          grep -q \
            'applicationId = "com.jarvis.android"' \
            app/build.gradle.kts

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee /tmp/gradle-build.log

      - name: Show Kotlin error
        if: failure()
        shell: bash
        run: |
          echo "========== ACTUAL BUILD ERROR =========="

          if [ -f /tmp/gradle-build.log ]; then
            grep -n -E \
              "e: |error:|Unresolved reference|Execution failed for task|FAILURE:" \
              /tmp/gradle-build.log |
              tail -n 100 || true
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_DIR="/tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug"

          APK_FILE=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

          echo "APK found:"
          echo "$APK_FILE"

      - name: Verify APK package
        shell: bash
        run: |
          set -e

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          PACKAGE_INFO=$(
            "$AAPT" dump badging "$APK_PATH" |
            grep '^package:'
          )

          echo "$PACKAGE_INFO"

          if ! echo "$PACKAGE_INFO" |
            grep -q "name='com.jarvis.android'"; then

            echo "ERROR: Wrong APK package"

            exit 1
          fi

          echo "APK PACKAGE VERIFIED"
          echo "com.jarvis.android"

      - name: Publish APK Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          TAG="jarvis-build-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create \
            "$TAG" \
            "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "Jarvis APK Build #${{ github.run_number }}" \
            --notes "Jarvis Local AI APK. Package ID: com.jarvis.android."

          echo "================================"
          echo "JARVIS APK RELEASE CREATED"
          echo "================================"

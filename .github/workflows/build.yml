name: Build and Release Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

      - name: Download official llama.cpp
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

          PROJECT="/tmp/llama.cpp/examples/llama.android"

          test -f "$PROJECT/gradlew"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/lib/build.gradle.kts"

          echo "Official llama.cpp Android project verified."

      - name: Read native tool versions
        shell: bash
        run: |
          set -euo pipefail

          FILE="/tmp/llama.cpp/examples/llama.android/lib/build.gradle.kts"

          NDK_VERSION="$(
            sed -n \
              's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              "$FILE" \
              | head -n 1
          )"

          CMAKE_VERSION="$(
            sed -n \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              "$FILE" \
              | head -n 1
          )"

          test -n "$NDK_VERSION"
          test -n "$CMAKE_VERSION"

          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$CMAKE_VERSION" >> "$GITHUB_ENV"

          echo "NDK: $NDK_VERSION"
          echo "CMake: $CMAKE_VERSION"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;$CMAKE_VERSION" \
            "ndk;$NDK_VERSION"

      - name: Extract Jarvis source
        shell: bash
        run: |
          set -euo pipefail

          TEMP="/tmp/jarvis_extract"

          rm -rf "$TEMP"
          mkdir -p "$TEMP"

          test -f "$GITHUB_WORKSPACE/jarvis-github-final.zip"

          echo "Testing Jarvis ZIP..."

          unzip -t \
            "$GITHUB_WORKSPACE/jarvis-github-final.zip"

          echo "Extracting Jarvis ZIP..."

          unzip -q \
            "$GITHUB_WORKSPACE/jarvis-github-final.zip" \
            -d "$TEMP"

          echo "Extracted structure:"

          find "$TEMP" \
            -maxdepth 10 \
            -print \
            | sort \
            | head -500

          JARVIS_MAIN="$(
            find "$TEMP" \
              -type d \
              -path "*/app/src/main" \
              | head -n 1 \
              || true
          )"

          if [ -z "$JARVIS_MAIN" ]; then
            echo "ERROR: app/src/main not found inside Jarvis ZIP."
            exit 1
          fi

          echo "JARVIS_MAIN=$JARVIS_MAIN" >> "$GITHUB_ENV"

          echo "Jarvis source found:"
          echo "$JARVIS_MAIN"

      - name: Verify Jarvis source
        shell: bash
        run: |
          set -euo pipefail

          test -f "$JARVIS_MAIN/AndroidManifest.xml"

          test -f \
            "$JARVIS_MAIN/java/com/jarvis/android/MainActivity.kt"

          test -f \
            "$JARVIS_MAIN/java/com/jarvis/android/JarvisService.java"

          grep -q \
            '^package com.jarvis.android' \
            "$JARVIS_MAIN/java/com/jarvis/android/MainActivity.kt"

          grep -q \
            '^package com.jarvis.android' \
            "$JARVIS_MAIN/java/com/jarvis/android/JarvisService.java"

          grep -q \
            'com.arm.aichat' \
            "$JARVIS_MAIN/java/com/jarvis/android/MainActivity.kt"

          if grep -R -q \
            'com.example.llama.aichat' \
            "$JARVIS_MAIN"; then

            echo "ERROR: Old package found."
            exit 1
          fi

          echo "Jarvis source verification PASSED."

      - name: Install Jarvis source
        shell: bash
        run: |
          set -euo pipefail

          LLAMA_ANDROID="/tmp/llama.cpp/examples/llama.android"
          TARGET="$LLAMA_ANDROID/app/src/main"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          cp -R \
            "$JARVIS_MAIN/." \
            "$TARGET/"

          echo "Jarvis source installed."

      - name: Verify installed source
        shell: bash
        run: |
          set -euo pipefail

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          test -f "$TARGET/AndroidManifest.xml"

          test -f \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          test -f \
            "$TARGET/java/com/jarvis/android/JarvisService.java"

          grep -q \
            '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          grep -q \
            '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/JarvisService.java"

          grep -q \
            'import com.arm.aichat' \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          test -d \
            "/tmp/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat"

          if grep -R -q \
            'com.example.llama.aichat' \
            "$TARGET"; then

            echo "ERROR: Old package remains."
            exit 1
          fi

          echo "Installed source verification PASSED."

      - name: Configure Jarvis application ID
        shell: bash
        run: |
          set -euo pipefail

          FILE="/tmp/llama.cpp/examples/llama.android/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "/tmp/llama.cpp/examples/llama.android/app/build.gradle.kts"
          )

          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'(?m)^[ \t]*namespace[ \t]*=[ \t]*"[^"]*"[ \t]*$',
              '    namespace = "com.jarvis.android"',
              text,
              count=1
          )

          text = re.sub(
              r'(?m)^[ \t]*applicationId[ \t]*=[ \t]*"[^"]*"[ \t]*$',
              '        applicationId = "com.jarvis.android"',
              text,
              count=1
          )

          path.write_text(text, encoding="utf-8")
          PY

          grep -q \
            'namespace = "com.jarvis.android"' \
            "$FILE"

          grep -q \
            'applicationId = "com.jarvis.android"' \
            "$FILE"

          echo "Application ID configured."

      - name: Verify Arm AI library
        shell: bash
        run: |
          set -euo pipefail

          ARM="/tmp/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat"

          test -d "$ARM"

          grep -R -q \
            'package com.arm.aichat' \
            "$ARM"

          echo "Arm AI library verified."

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            --no-daemon \
            2>&1 | tee /tmp/jarvis-build.log

      - name: Show useful build errors
        if: failure()
        shell: bash
        run: |
          echo "======================================"
          echo "JARVIS BUILD ERROR"
          echo "======================================"

          if [ -f /tmp/jarvis-build.log ]; then
            grep -n -E \
              'e: |error:|Unresolved reference|FAILURE:|Execution failed for task|BUILD FAILED' \
              /tmp/jarvis-build.log \
              | tail -n 250 \
              || true
          fi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="/tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug"

          APK="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              | head -n 1 \
              || true
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_SOURCE=$APK" >> "$GITHUB_ENV"

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail

          test -x "$AAPT"

          INFO="$(
            "$AAPT" \
              dump badging \
              "$APK_SOURCE" \
              | grep '^package:'
          )"

          echo "$INFO"

          echo "$INFO" \
            | grep -q "name='com.jarvis.android'"

          echo "APK PACKAGE VERIFIED."

      - name: Prepare release APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp \
            "$APK_SOURCE" \
            "$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk"

          echo \
            "APK_PATH=$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk" \
            >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="jarvis-build-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create \
            "$TAG" \
            "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "Jarvis Local AI APK #${{ github.run_number }}" \
            --notes "Jarvis Local AI APK. Package: com.jarvis.android."

          echo "======================================"
          echo "JARVIS APK RELEASE CREATED"
          echo "======================================"

name: Build Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Download official llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

      - name: Extract and locate Jarvis source
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY FILES ====="
          ls -la

          TEMP_EXTRACT="/tmp/jarvis_extract"
          rm -rf "$TEMP_EXTRACT"
          mkdir -p "$TEMP_EXTRACT"

          if [ ! -f "jarvis-github-final.zip" ]; then
            echo "ERROR: jarvis-github-final.zip not found"
            exit 1
          fi

          echo "Extracting jarvis-github-final.zip..."
          unzip -q "jarvis-github-final.zip" -d "$TEMP_EXTRACT"

          echo "===== EXTRACTING JARVIS SOURCE ====="

          if [ -f "$TEMP_EXTRACT/JarvisSource.zip" ]; then
            echo "Found JarvisSource.zip"
            unzip -q \
              "$TEMP_EXTRACT/JarvisSource.zip" \
              -d "$TEMP_EXTRACT/jarvis_content"
          fi

          JARVIS_APP_DIR=$(find "$TEMP_EXTRACT" \
            -type d \
            -path "*/app/src/main" \
            | head -n 1)

          if [ -z "$JARVIS_APP_DIR" ]; then
            echo "ERROR: Could not locate app/src/main"
            find "$TEMP_EXTRACT" -maxdepth 7 -print
            exit 1
          fi

          echo "===== JARVIS SOURCE FOUND ====="
          echo "JARVIS_APP_DIR=$JARVIS_APP_DIR"

          REQUIRED_FILES=(
            "AndroidManifest.xml"
            "java/com/jarvis/android/MainActivity.kt"
            "java/com/jarvis/android/JarvisService.java"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$JARVIS_APP_DIR/$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          cp -R "$JARVIS_APP_DIR"/. "$TARGET/"

          echo "Jarvis source injected successfully."

      - name: Verify Jarvis source
        shell: bash
        run: |
          set -e

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          echo "===== FINAL SOURCE FILES ====="
          find "$TARGET" -type f | sort

          grep -q "package com.jarvis.android" \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          grep -q "package com.jarvis.android" \
            "$TARGET/java/com/jarvis/android/JarvisService.java"

          echo "Jarvis package verification passed."

      - name: Configure Jarvis package
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          s = p.read_text()

          s = s.replace(
              'namespace = "com.arm.aichat"',
              'namespace = "com.jarvis.android"'
          )

          s = s.replace(
              'applicationId = "com.arm.aichat"',
              'applicationId = "com.jarvis.android"'
          )

          if 'namespace = "com.jarvis.android"' not in s:
              s = s.replace(
                  "android {",
                  'android {\n    namespace = "com.jarvis.android"',
                  1
              )

          if 'applicationId = "com.jarvis.android"' not in s:
              s = s.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        applicationId = "com.jarvis.android"',
                  1
              )

          p.write_text(s)

          print("namespace = com.jarvis.android")
          print("applicationId = com.jarvis.android")
          PY

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_DIR="/tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found"
            exit 1
          fi

          APK_FILES=$(find "$APK_DIR" -type f -name "*.apk")

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi

          echo "===== APK FILES ====="
          echo "$APK_FILES"

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

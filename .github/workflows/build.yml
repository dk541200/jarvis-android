name: Build Jarvis Local AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java
      # --------------------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt" >> "$GITHUB_ENV"

          echo "Android SDK located successfully."

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;29.0.13113456"

          echo "Android SDK packages installed."

      # --------------------------------------------------
      # 4. Official llama.cpp
      # --------------------------------------------------

      - name: Download official llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

          test -f \
            /tmp/llama.cpp/examples/llama.android/gradlew

          test -d \
            /tmp/llama.cpp/examples/llama.android/lib

          echo "Official llama.cpp downloaded successfully."

      # --------------------------------------------------
      # 5. Extract Jarvis source
      # --------------------------------------------------

      - name: Extract Jarvis source
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/jarvis-github-final.zip"
          EXTRACT="/tmp/jarvis-source"

          echo "Checking Jarvis source ZIP..."

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: jarvis-github-final.zip not found."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              | sort \
              | head -100
            exit 1
          fi

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          unzip -q "$ZIP" -d "$EXTRACT"

          echo "ZIP extracted."

          # The verified Jarvis ZIP structure is:
          #
          # app/
          # └── src/
          #     └── main/
          #
          SRC="$EXTRACT/app/src/main"

          echo "Jarvis source:"
          echo "$SRC"

          # Verify all required files before continuing.

          test -d "$SRC"

          test -f \
            "$SRC/AndroidManifest.xml"

          test -f \
            "$SRC/java/com/jarvis/android/MainActivity.kt"

          test -f \
            "$SRC/java/com/jarvis/android/JarvisService.java"

          echo "Jarvis source verified successfully."

          echo "$SRC" > /tmp/jarvis-source-path

      # --------------------------------------------------
      # 6. Inject Jarvis source
      # --------------------------------------------------

      - name: Inject Jarvis source into llama.cpp
        shell: bash
        run: |
          set -e

          SRC="$(cat /tmp/jarvis-source-path)"
          DEST="/tmp/llama.cpp/examples/llama.android/app"

          echo "SOURCE:"
          echo "$SRC"

          echo "DESTINATION:"
          echo "$DEST"

          # Remove only the official app's source areas.
          # The llama.cpp :lib module is NOT touched.

          rm -rf \
            "$DEST/src/main/java" \
            "$DEST/src/main/kotlin" \
            "$DEST/src/main/res" \
            "$DEST/src/main/assets"

          mkdir -p \
            "$DEST/src/main/java" \
            "$DEST/src/main/res" \
            "$DEST/src/main/assets"

          # Java/Kotlin source

          cp -R \
            "$SRC/java/." \
            "$DEST/src/main/java/"

          # Resources

          if [ -d "$SRC/res" ]; then
            cp -R \
              "$SRC/res/." \
              "$DEST/src/main/res/"
          fi

          # Assets

          if [ -d "$SRC/assets" ]; then
            cp -R \
              "$SRC/assets/." \
              "$DEST/src/main/assets/"
          fi

          # Manifest

          cp \
            "$SRC/AndroidManifest.xml" \
            "$DEST/src/main/AndroidManifest.xml"

          echo "Jarvis source injected successfully."

      # --------------------------------------------------
      # 7. Download Llama model
      # --------------------------------------------------

      - name: Download bundled Llama GGUF
        shell: bash
        run: |
          set -e

          MODEL_DIR="/tmp/jarvis-model"
          MODEL="$MODEL_DIR/Llama-3.2-1B-Instruct-Q4_0.gguf"

          mkdir -p "$MODEL_DIR"

          echo "Downloading Llama 3.2 1B Q4_0..."

          curl \
            -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            -o "$MODEL" \
            "https://huggingface.co/gaianet/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_0.gguf"

          test -f "$MODEL"

          SIZE=$(stat -c%s "$MODEL")

          echo "Downloaded model size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 700000000 ]; then
            echo "ERROR: GGUF download is incomplete."
            exit 1
          fi

          echo "GGUF download successful."

      # --------------------------------------------------
      # 8. Bundle model inside APK
      # --------------------------------------------------

      - name: Bundle Llama model into APK
        shell: bash
        run: |
          set -e

          DEST="/tmp/llama.cpp/examples/llama.android/app"
          MODEL="/tmp/jarvis-model/Llama-3.2-1B-Instruct-Q4_0.gguf"

          mkdir -p "$DEST/src/main/assets"

          cp \
            "$MODEL" \
            "$DEST/src/main/assets/Llama-3.2-1B-Instruct-Q4_0.gguf"

          FINAL_MODEL="$DEST/src/main/assets/Llama-3.2-1B-Instruct-Q4_0.gguf"

          test -f "$FINAL_MODEL"

          SIZE=$(stat -c%s "$FINAL_MODEL")

          echo "Final bundled model size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 700000000 ]; then
            echo "ERROR: Bundled model is incomplete."
            exit 1
          fi

          echo "Model successfully bundled into Android project."

      # --------------------------------------------------
      # 9. Verify source
      # --------------------------------------------------

      - name: Verify Jarvis source
        shell: bash
        run: |
          set -e

          MAIN="/tmp/llama.cpp/examples/llama.android/app/src/main"

          echo "Checking Jarvis package..."

          grep -R \
            "package com.jarvis.android" \
            "$MAIN/java/com/jarvis/android"

          echo "Checking AI library imports..."

          grep -n \
            "import com.arm.aichat" \
            "$MAIN/java/com/jarvis/android/MainActivity.kt"

          echo "Checking required files..."

          test -f \
            "$MAIN/java/com/jarvis/android/MainActivity.kt"

          test -f \
            "$MAIN/java/com/jarvis/android/JarvisService.java"

          test -f \
            "$MAIN/AndroidManifest.xml"

          test -f \
            "$MAIN/assets/Llama-3.2-1B-Instruct-Q4_0.gguf"

          # Never allow the old app package.

          if grep -R \
            "com.example.llama.aichat" \
            "$MAIN" >/dev/null 2>&1; then

            echo "ERROR: Old package com.example.llama.aichat found."

            grep -R -n \
              "com.example.llama.aichat" \
              "$MAIN"

            exit 1
          fi

          echo "All source checks passed."

      # --------------------------------------------------
      # 10. Configure package
      # --------------------------------------------------

      - name: Configure Jarvis application ID
        shell: bash
        run: |
          set -e

          GRADLE="/tmp/llama.cpp/examples/llama.android/app/build.gradle.kts"

          python3 - <<'PY'
          import re

          path = "/tmp/llama.cpp/examples/llama.android/app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.jarvis.android"',
              text,
              count=1
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.jarvis.android"',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo "Final Gradle configuration:"

          grep -n \
            -E "namespace|applicationId" \
            "$GRADLE"

      # --------------------------------------------------
      # 11. Build
      # --------------------------------------------------

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            --no-daemon

      # --------------------------------------------------
      # 12. Verify APK
      # --------------------------------------------------

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find \
            /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          test -f "$APK"

          echo "APK:"
          echo "$APK"

          echo "Checking package ID..."

          "$AAPT" dump badging "$APK" \
            | grep -q "name='com.jarvis.android'"

          "$AAPT" dump badging "$APK" \
            | grep "^package:"

          APK_SIZE=$(stat -c%s "$APK")

          echo "APK size:"
          echo "$APK_SIZE bytes"

          mkdir -p \
            "$GITHUB_WORKSPACE/release"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk"

          echo "APK verification successful."

      # --------------------------------------------------
      # 13. GitHub Release
      # --------------------------------------------------

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="jarvis-build-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create \
            "$TAG" \
            "$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk" \
            --repo "${{ github.repository }}" \
            --title "Jarvis Local AI APK #${{ github.run_number }}" \
            --notes "Jarvis Local AI with bundled Llama 3.2 1B Q4_0 model. Package: com.jarvis.android"

          echo "Release created successfully."

name: Build and Release Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          test -n "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Download official llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

      - name: Verify official Android project
        shell: bash
        run: |
          set -e

          test -f /tmp/llama.cpp/examples/llama.android/app/build.gradle.kts
          test -d /tmp/llama.cpp/examples/llama.android/lib
          test -f /tmp/llama.cpp/examples/llama.android/lib/build.gradle.kts

          echo "Official llama.cpp Android project verified."

      - name: Extract Jarvis source
        shell: bash
        run: |
          set -e

          TEMP="/tmp/jarvis_extract"

          rm -rf "$TEMP"
          mkdir -p "$TEMP"

          test -f jarvis-github-final.zip

          unzip -q jarvis-github-final.zip -d "$TEMP"

          if [ -f "$TEMP/JarvisSource.zip" ]; then
            mkdir -p "$TEMP/jarvis_content"
            unzip -q "$TEMP/JarvisSource.zip" -d "$TEMP/jarvis_content"
          fi

          JARVIS_MAIN=$(find "$TEMP" \
            -type d \
            -path "*/app/src/main" \
            | head -n 1)

          test -n "$JARVIS_MAIN"

          echo "JARVIS_MAIN=$JARVIS_MAIN" >> "$GITHUB_ENV"

      - name: Install Jarvis app source
        shell: bash
        run: |
          set -e

          LLAMA_ANDROID="/tmp/llama.cpp/examples/llama.android"

          TARGET="$LLAMA_ANDROID/app/src/main"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          cp -R "$JARVIS_MAIN"/. "$TARGET/"

          # Only Jarvis's application package is changed.
          # com.arm.aichat MUST remain untouched.
          find "$TARGET" \
            -type f \
            \( -name "*.kt" -o -name "*.java" -o -name "*.xml" \) \
            -print0 |
          xargs -0 -r sed -i \
            's/com\.example\.llama\.aichat/com.jarvis.android/g'

      - name: Verify Jarvis source
        shell: bash
        run: |
          set -e

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          test -f "$TARGET/AndroidManifest.xml"

          test -f \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          test -f \
            "$TARGET/java/com/jarvis/android/JarvisService.java"

          grep -q \
            '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          grep -q \
            '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/JarvisService.java"

          # The Arm AI library package must still exist.
          if ! grep -R \
            -q "com.arm.aichat" \
            "$TARGET"; then

            echo "WARNING: Jarvis source does not reference com.arm.aichat."
          fi

          if grep -R \
            -q "com.example.llama.aichat" \
            "$TARGET"; then

            echo "ERROR: Old package still exists."
            exit 1
          fi

          echo "Jarvis source verification passed."

      - name: Configure official Android project
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'(?m)^\s*namespace\s*=\s*"[^"]*"\s*$',
              '',
              s
          )

          s = re.sub(
              r'(?m)^\s*applicationId\s*=\s*"[^"]*"\s*$',
              '',
              s
          )

          s = s.replace(
              "android {",
              'android {\n    namespace = "com.jarvis.android"',
              1
          )

          s = s.replace(
              "defaultConfig {",
              'defaultConfig {\n        applicationId = "com.jarvis.android"',
              1
          )

          p.write_text(s)
          PY

          grep -q \
            'namespace = "com.jarvis.android"' \
            app/build.gradle.kts

          grep -q \
            'applicationId = "com.jarvis.android"' \
            app/build.gradle.kts

          # IMPORTANT:
          # Do NOT modify the lib module's com.arm.aichat package.

          echo "Gradle configuration verified."

      - name: Build APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --info \
            --no-daemon \
            2>&1 | tee /tmp/jarvis-build.log

      - name: Show useful error
        if: failure()
        shell: bash
        run: |
          echo "========== JARVIS BUILD ERROR =========="

          if [ -f /tmp/jarvis-build.log ]; then
            grep -n -E \
              "e: |error:|Unresolved reference|FAILURE:|Execution failed for task" \
              /tmp/jarvis-build.log \
              | tail -n 150 || true
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_DIR="/tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug"

          APK_FILE=$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK_FILE"

          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK_FILE"

      - name: Verify APK package
        shell: bash
        run: |
          set -e

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          INFO=$(
            "$AAPT" dump badging "$APK_PATH" |
            grep '^package:'
          )

          echo "$INFO"

          echo "$INFO" |
            grep -q "name='com.jarvis.android'"

          echo "APK PACKAGE VERIFIED."

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="jarvis-build-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create \
            "$TAG" \
            "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "Jarvis APK Build #${{ github.run_number }}" \
            --notes "Jarvis Local AI APK. Package: com.jarvis.android"

          echo "======================================"
          echo "JARVIS APK RELEASE CREATED"
          echo "======================================"

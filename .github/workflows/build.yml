name: Build and Release Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f | head -100 || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Download official llama.cpp source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/llama.cpp
          git clone --depth 1 --branch master \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

          test -f /tmp/llama.cpp/examples/llama.android/gradlew
          test -f /tmp/llama.cpp/examples/llama.android/lib/build.gradle.kts
          test -f /tmp/llama.cpp/examples/llama.android/app/build.gradle.kts

          echo "Official llama.cpp Android project found."

      - name: Read official Android native tool versions
        shell: bash
        run: |
          set -euo pipefail

          LIB_GRADLE="/tmp/llama.cpp/examples/llama.android/lib/build.gradle.kts"

          NDK_VERSION="$(sed -n 's/^[[:space:]]*ndkVersion = "\([^"]*\)".*/\1/p' "$LIB_GRADLE" | head -n 1)"
          CMAKE_VERSION="$(sed -n 's/^[[:space:]]*version = "\([^"]*\)".*/\1/p' "$LIB_GRADLE" | head -n 1)"

          test -n "$NDK_VERSION"
          test -n "$CMAKE_VERSION"

          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
          echo "CMAKE_VERSION=$CMAKE_VERSION" >> "$GITHUB_ENV"

          echo "Official NDK: $NDK_VERSION"
          echo "Official CMake: $CMAKE_VERSION"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;$CMAKE_VERSION" \
            "ndk;$NDK_VERSION"

      - name: Locate Jarvis source
        shell: bash
        run: |
          set -euo pipefail

          TEMP="/tmp/jarvis_extract"
          rm -rf "$TEMP"
          mkdir -p "$TEMP"

          # Preferred: source already extracted into the repository.
          if [ -d "$GITHUB_WORKSPACE/app/src/main" ]; then
            JARVIS_MAIN="$GITHUB_WORKSPACE/app/src/main"
            echo "Using repository app/src/main"
          # Fallback: use the supplied direct source archive.
          elif [ -f "$GITHUB_WORKSPACE/jarvis-github-final.zip" ]; then
            echo "Using jarvis-github-final.zip"
            unzip -t "$GITHUB_WORKSPACE/jarvis-github-final.zip"
            unzip -q "$GITHUB_WORKSPACE/jarvis-github-final.zip" -d "$TEMP"

            JARVIS_MAIN="$(find "$TEMP" -type d -path '*/app/src/main' | head -n 1 || true)"

            # Also support an older archive that contains JarvisSource.zip.
            if [ -z "$JARVIS_MAIN" ]; then
              NESTED="$(find "$TEMP" -type f -name 'JarvisSource.zip' | head -n 1 || true)"
              if [ -n "$NESTED" ]; then
                mkdir -p "$TEMP/nested"
                unzip -t "$NESTED"
                unzip -q "$NESTED" -d "$TEMP/nested"
                JARVIS_MAIN="$(find "$TEMP/nested" -type d -path '*/app/src/main' | head -n 1 || true)"
              fi
            fi
          else
            echo "ERROR: No app/src/main and no jarvis-github-final.zip found."
            exit 1
          fi

          if [ -z "$JARVIS_MAIN" ]; then
            echo "ERROR: Could not find app/src/main in Jarvis source."
            echo "Repository/archive structure:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -print | sort | head -300 || true
            echo "Extracted structure:"
            find "$TEMP" -maxdepth 7 -print | sort | head -300 || true
            exit 1
          fi

          echo "JARVIS_MAIN=$JARVIS_MAIN" >> "$GITHUB_ENV"
          echo "JARVIS_MAIN=$JARVIS_MAIN"

      - name: Install Jarvis app source into official project
        shell: bash
        run: |
          set -euo pipefail

          LLAMA_ANDROID="/tmp/llama.cpp/examples/llama.android"
          TARGET="$LLAMA_ANDROID/app/src/main"

          test -f "$JARVIS_MAIN/AndroidManifest.xml"
          test -f "$JARVIS_MAIN/java/com/jarvis/android/MainActivity.kt"
          test -f "$JARVIS_MAIN/java/com/jarvis/android/JarvisService.java"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -R "$JARVIS_MAIN/." "$TARGET/"

          echo "Jarvis source installed."

      - name: Verify Jarvis source and Arm library boundary
        shell: bash
        run: |
          set -euo pipefail

          TARGET="/tmp/llama.cpp/examples/llama.android/app/src/main"

          grep -q '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"
          grep -q '^package com.jarvis.android' \
            "$TARGET/java/com/jarvis/android/JarvisService.java"
          grep -q 'import com.arm.aichat' \
            "$TARGET/java/com/jarvis/android/MainActivity.kt"

          if grep -R -q 'com.example.llama.aichat' "$TARGET"; then
            echo "ERROR: old application package remains in Jarvis source."
            grep -R -n 'com.example.llama.aichat' "$TARGET"
            exit 1
          fi

          # The Arm library package is owned by the official lib module and must not
          # be renamed to com.jarvis.android.
          grep -R -q 'com.arm.aichat' \
            "/tmp/llama.cpp/examples/llama.android/lib/src/main/java"

          echo "Source/package verification passed."

      - name: Configure Jarvis application ID without modifying lib package
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('/tmp/llama.cpp/examples/llama.android/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'(?m)^\s*namespace\s*=\s*"[^"]*"\s*$',
                     '    namespace = "com.jarvis.android"', s, count=1)
          s = re.sub(r'(?m)^\s*applicationId\s*=\s*"[^"]*"\s*$',
                     '        applicationId = "com.jarvis.android"', s, count=1)

          # Keep the debug build simple and avoid shrinking the JNI/Kotlin bridge.
          s = re.sub(r'(?s)debug\s*\{.*?isMinifyEnabled\s*=\s*true.*?\}',
                     'debug {\n            isMinifyEnabled = false\n            isShrinkResources = false\n        }', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -q 'namespace = "com.jarvis.android"' \
            /tmp/llama.cpp/examples/llama.android/app/build.gradle.kts
          grep -q 'applicationId = "com.jarvis.android"' \
            /tmp/llama.cpp/examples/llama.android/app/build.gradle.kts

      - name: Make native load errors diagnosable
        shell: bash
        run: |
          set -euo pipefail

          IMPL="/tmp/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt"
          EX="/tmp/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt"

          test -f "$IMPL"
          test -f "$EX"

          python3 - <<'PY'
          from pathlib import Path

          impl = Path('/tmp/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt')
          s = impl.read_text(encoding='utf-8')
          old = '''                load(pathToModel).let {\n                    // TODO-han.yin: find a better way to pass other error codes\n                    if (it != 0) throw UnsupportedArchitectureException()\n                }'''
          new = '''                load(pathToModel).let { result ->\n                    if (result != 0) {\n                        throw UnsupportedArchitectureException(\n                            "Native llama.cpp model load failed (code=$result)"\n                        )\n                    }\n                }'''
          if old not in s:
              raise SystemExit('Expected InferenceEngineImpl load block was not found')
          impl.write_text(s.replace(old, new, 1), encoding='utf-8')

          ex = Path('/tmp/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/InferenceEngine.kt')
          s = ex.read_text(encoding='utf-8')
          s = s.replace('class UnsupportedArchitectureException : Exception()',
                        'class UnsupportedArchitectureException(message: String? = null) : Exception(message)')
          ex.write_text(s, encoding='utf-8')
          PY

          grep -q 'Native llama.cpp model load failed' "$IMPL"
          grep -q 'UnsupportedArchitectureException(message: String? = null)' "$EX"

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            --no-daemon 2>&1 | tee /tmp/jarvis-build.log

      - name: Show useful build errors
        if: failure()
        shell: bash
        run: |
          echo "========== JARVIS BUILD ERROR =========="
          if [ -f /tmp/jarvis-build.log ]; then
            grep -n -E 'e: |error:|Unresolved reference|FAILURE:|Execution failed for task|BUILD FAILED' \
              /tmp/jarvis-build.log | tail -n 200 || true
          fi

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="/tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"

          test -n "$APK"
          test -x "$AAPT"

          INFO="$($AAPT dump badging "$APK" | grep '^package:')"
          echo "$INFO"
          echo "$INFO" | grep -q "name='com.jarvis.android'"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk"

          echo "APK_PATH=$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk" >> "$GITHUB_ENV"
          echo "APK PACKAGE VERIFIED."

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="jarvis-build-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create \
            "$TAG" \
            "$APK_PATH" \
            --repo "${{ github.repository }}" \
            --title "Jarvis Local AI APK #${{ github.run_number }}" \
            --notes "Jarvis Local AI APK. Package: com.jarvis.android. Official llama.cpp Android binding used as the native engine."

          echo "JARVIS APK RELEASE CREATED"

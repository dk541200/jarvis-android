
name: Build and Publish Jarvis APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Jarvis-Complete-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: jarvis-apk-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and publish to Releases
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/Jarvis-Complete-Source.zip"

          test -f "$ZIP" || {
            echo "ERROR: Jarvis-Complete-Source.zip not found in repository root"
            exit 1
          }

          unzip -t "$ZIP"

          unzip -l "$ZIP" | grep -q \
            'Jarvis-Complete/app/build.gradle.kts'

          unzip -l "$ZIP" | grep -q \
            'Jarvis-Complete/gradlew'

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/jarvis-source"

          unzip -q \
            "$GITHUB_WORKSPACE/Jarvis-Complete-Source.zip" \
            -d "$RUNNER_TEMP/jarvis-source"

          PROJECT="$RUNNER_TEMP/jarvis-source/Jarvis-Complete"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release-assets"

          cp \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$GITHUB_WORKSPACE/release-assets/Jarvis-Complete.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release-assets/Jarvis-Complete.apk" \
            > "$GITHUB_WORKSPACE/release-assets/SHA256SUMS.txt"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis APK Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Jarvis Android APK.

            Download Jarvis-Complete.apk from the release assets.
            This is a debug-signed APK for testing.
          files: |
            release-assets/Jarvis-Complete.apk
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          

name: Build Jarvis Preview or Update APK

on:
  workflow_dispatch:
    inputs:
      install_mode:
        description: "Preview installs beside your current Jarvis; update requires the exact same signing key as the installed app."
        type: choice
        options:
          - preview
          - update
        default: preview
        required: true
  push:
    branches: [main]
    paths:
      - 'Jarvis-Complete-Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: jarvis-embedded-apk-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK with Qwen3 0.6B + offline Hey Jarvis
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select safe app/signing mode
        shell: bash
        env:
          REQUESTED_INSTALL_MODE: ${{ inputs.install_mode || 'auto' }}
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          all_missing=0
          all_present=0
          missing_count=0
          for name in JARVIS_KEYSTORE_BASE64 JARVIS_KEYSTORE_PASSWORD JARVIS_KEY_ALIAS JARVIS_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing_count=$((missing_count + 1)); fi
          done
          if [ "$missing_count" -eq 4 ]; then all_missing=1; fi
          if [ "$missing_count" -eq 0 ]; then all_present=1; fi

          case "$REQUESTED_INSTALL_MODE" in
            preview)
              MODE=preview
              APP_ID='com.jarvis.android.preview'
              ;;
            update)
              if [ "$all_present" -ne 1 ]; then
                echo 'ERROR: Update mode requires all four JARVIS signing secrets, using the SAME key as the installed Jarvis app.'
                exit 1
              fi
              MODE=persistent
              APP_ID='com.jarvis.android'
              ;;
            auto)
              if [ "$all_present" -eq 1 ]; then
                MODE=persistent
                APP_ID='com.jarvis.android'
              elif [ "$all_missing" -eq 1 ]; then
                MODE=preview
                APP_ID='com.jarvis.android.preview'
              else
                echo 'ERROR: Only some signing secrets are set. Configure all four or remove incomplete secrets and build preview.'
                exit 1
              fi
              ;;
            *) echo "ERROR: Unknown install mode '$REQUESTED_INSTALL_MODE'"; exit 1 ;;
          esac
          echo "JARVIS_SIGNING_MODE=$MODE" >> "$GITHUB_ENV"
          echo "JARVIS_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "Jarvis mode selected: $MODE ($APP_ID). Current app will not be uninstalled."

      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/Jarvis-Complete-Source.zip"
          test -f "$ZIP" || { echo "ERROR: Jarvis-Complete-Source.zip not found in repository root"; exit 1; }
          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -q 'Jarvis-Complete/app/src/main/java/com/jarvis/android/EmbeddedLocalModel.kt'
          unzip -l "$ZIP" | grep -q 'Jarvis-Complete/app/src/main/java/com/jarvis/android/JarvisEngine.kt'
          unzip -l "$ZIP" | grep -q 'Jarvis-Complete/app/src/main/java/com/jarvis/android/AgentCoordinator.kt'
          unzip -l "$ZIP" | grep -q 'Jarvis-Complete/app/src/main/java/com/jarvis/android/OwnerVoiceProfile.kt'
          unzip -l "$ZIP" | grep -q 'Jarvis-Complete/app/src/main/java/com/jarvis/android/JarvisAccessibilityService.kt'
          unzip -l "$ZIP" | grep -q 'Jarvis-Complete/app/src/main/AndroidManifest.xml'

      - name: Extract Jarvis source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jarvis-source"
          unzip -q "$GITHUB_WORKSPACE/Jarvis-Complete-Source.zip" -d "$RUNNER_TEMP/jarvis-source"
          PROJECT="$RUNNER_TEMP/jarvis-source/Jarvis-Complete"
          test -f "$PROJECT/README.md"
          test -f "$PROJECT/app/src/main/java/com/jarvis/android/MainActivity.kt"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Clone official llama.cpp Android binding
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_CPP_REF='972b5fcc19670e597f8de9bf5cacfb85752a5fff'
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_REF"
          git -C "$RUNNER_TEMP/llama.cpp" submodule update --init --depth 1
          BASE="$RUNNER_TEMP/llama.cpp/examples/llama.android"
          test -f "$BASE/lib/src/main/java/com/arm/aichat/InferenceEngine.kt"
          test -f "$BASE/lib/src/main/cpp/CMakeLists.txt"
          echo "LLAMA_ANDROID_DIR=$BASE" >> "$GITHUB_ENV"
          echo "LLAMA_CPP_ROOT=$RUNNER_TEMP/llama.cpp" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'cmake;3.31.6' \
            'ndk;29.0.13113456'

      - name: Download Qwen3 0.6B Q4_K_M model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_NAME='Qwen3-0.6B-Q4_K_M.gguf'
          MODEL_DIR="$LLAMA_ANDROID_DIR/app/src/main/assets"
          MODEL="$MODEL_DIR/$MODEL_NAME"
          mkdir -p "$MODEL_DIR"
          curl --fail --location --show-error \
            --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
            -H 'User-Agent: Jarvis-Android-Build' \
            -o "$MODEL" \
            'https://huggingface.co/bartowski/Qwen_Qwen3-0.6B-GGUF/resolve/7bcae0bc7b0606f1e948f8cdb31b98a2c10635db/Qwen_Qwen3-0.6B-Q4_K_M.gguf'
          echo "9acfc1e001311f34b4252001b626f2e466d592a42065f66571bff3790d4e1b14  $MODEL" | sha256sum --check --status || { echo 'ERROR: Qwen3 model SHA-256 verification failed'; exit 1; }
          curl --fail --location --show-error --retry 3 \
            -o "$MODEL_DIR/LICENSE-APACHE-2.0.txt" \
            'https://www.apache.org/licenses/LICENSE-2.0.txt'
          cp "$LLAMA_CPP_ROOT/LICENSE" "$MODEL_DIR/LICENSE-LLAMA-CPP.txt"
          cat > "$MODEL_DIR/THIRD-PARTY-NOTICES.txt" <<'NOTICE'
          Qwen3-0.6B Q4_K_M GGUF quantization: bartowski/Qwen_Qwen3-0.6B-GGUF.
          The underlying Qwen3 model is distributed under Apache License 2.0.
          Vosk Hindi small model: vosk-model-small-hi-0.22 (Apache License 2.0).
          Vosk speaker identification model: vosk-model-spk-0.4 (Apache License 2.0).
          llama.cpp Android inference binding: ggml-org/llama.cpp (MIT License).
          See the adjacent license files for terms.
          NOTICE
          SIZE=$(stat -c%s "$MODEL")
          echo "Qwen3 model bytes: $SIZE"
          test "$SIZE" -gt 300000000 || { echo 'ERROR: model download is missing or unexpectedly small'; exit 1; }
          sha256sum "$MODEL" | tee "$RUNNER_TEMP/model.sha256"

          # Hindi Vosk small model: offline keyword detection for an explicit opt-in foreground listener.
          WAKE_ZIP="$RUNNER_TEMP/vosk-model-small-hi-0.22.zip"
          curl --fail --location --show-error \
            --retry 4 --retry-delay 4 --connect-timeout 30 --max-time 900 \
            -H 'User-Agent: Jarvis-Android-Build' \
            -o "$WAKE_ZIP" \
            'https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip'
          unzip -q "$WAKE_ZIP" -d "$RUNNER_TEMP/vosk-hindi"
          test -f "$RUNNER_TEMP/vosk-hindi/vosk-model-small-hi-0.22/am/final.mdl"
          mkdir -p "$MODEL_DIR/jarvis-wake"
          cp -R "$RUNNER_TEMP/vosk-hindi/vosk-model-small-hi-0.22/." "$MODEL_DIR/jarvis-wake/"
          curl --fail --location --show-error --retry 3 \
            -o "$MODEL_DIR/LICENSE-VOSK-APACHE-2.0.txt" \
            'https://www.apache.org/licenses/LICENSE-2.0.txt'
          test -f "$MODEL_DIR/jarvis-wake/conf/model.conf"

          # Vosk speaker vectors enable experimental owner-voice matching for the hands-free listener.
          # This is not secure authentication and must never bypass the Android device lock.
          SPEAKER_ZIP="$RUNNER_TEMP/vosk-model-spk-0.4.zip"
          curl --fail --location --show-error \
            --retry 4 --retry-delay 4 --connect-timeout 30 --max-time 900 \
            -H 'User-Agent: Jarvis-Android-Build' \
            -o "$SPEAKER_ZIP" \
            'https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip'
          unzip -q "$SPEAKER_ZIP" -d "$RUNNER_TEMP/vosk-speaker"
          SPEAKER_DIR="$RUNNER_TEMP/vosk-speaker/vosk-model-spk-0.4"
          for f in mfcc.conf final.ext.raw mean.vec transform.mat; do
            test -f "$SPEAKER_DIR/$f" || { echo "ERROR: Vosk speaker model is missing $f"; exit 1; }
          done
          mkdir -p "$MODEL_DIR/jarvis-speaker"
          cp -R "$SPEAKER_DIR/." "$MODEL_DIR/jarvis-speaker/"
          test -f "$MODEL_DIR/jarvis-speaker/mfcc.conf"

      - name: Inject Jarvis app and configure native inference
        shell: bash
        run: |
          set -euo pipefail
          SRC="$PROJECT_DIR/app/src/main"
          BASE="$LLAMA_ANDROID_DIR"
          DEST="$BASE/app/src/main"

          rm -rf "$DEST/java" "$DEST/kotlin" "$DEST/res"
          mkdir -p "$DEST/java" "$DEST/res" "$DEST/assets"
          cp -R "$SRC/." "$DEST/"
          test "$(stat -c%s "$DEST/assets/Qwen3-0.6B-Q4_K_M.gguf")" -gt 300000000
          test -f "$DEST/assets/jarvis-wake/am/final.mdl"
          test -f "$DEST/assets/jarvis-wake/conf/model.conf"
          for f in mfcc.conf final.ext.raw mean.vec transform.mat; do test -f "$DEST/assets/jarvis-speaker/$f"; done

          # Use an app-owned launcher icon. The previous @android:drawable/ic_dialog_info
          # reference makes build-tools 36 aapt fail while dumping APK badging.
          mkdir -p "$DEST/res/drawable"
          sed -i 's|android:icon="@android:drawable/ic_dialog_info"|android:icon="@drawable/ic_jarvis"|' "$DEST/AndroidManifest.xml"
          cat > "$DEST/res/drawable/ic_jarvis.xml" <<'ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#0A0F1D" android:pathData="M24,2 L44,13 L44,35 L24,46 L4,35 L4,13 Z" />
              <path android:fillColor="#43E8FF" android:pathData="M24,8 L38,16 L38,32 L24,40 L10,32 L10,16 Z" />
              <path android:fillColor="#0A0F1D" android:pathData="M24,14 L32,19 L32,29 L24,34 L16,29 L16,19 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M22,20 L26,20 L26,28 L22,28 Z" />
          </vector>
          ICON
          grep -q 'android:icon="@drawable/ic_jarvis"' "$DEST/AndroidManifest.xml"

          cat > "$BASE/app/build.gradle.kts" <<'GRADLE'
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.jetbrains.kotlin.android)
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.0"
          }

          android {
              namespace = "com.jarvis.android"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.jarvis.android"
                  minSdk = 33
                  targetSdk = 35
                  versionCode = 5
                  versionName = "3.2.0-agent-preview"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables { useSupportLibrary = true }
              }
              buildTypes {
                  debug { isMinifyEnabled = false }
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              buildFeatures { compose = true; buildConfig = true }
              packaging {
                  jniLibs { useLegacyPackaging = true }
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          // Kotlin 2.3.0 removed the old kotlinOptions.jvmTarget DSL.
          // The modern compilerOptions block belongs at project level, outside android {}.
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation(project(":lib"))
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("net.java.dev.jna:jna:5.18.1@aar")
              implementation("com.alphacephei:vosk-android:0.3.75@aar")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          GRADLE

          python - "$BASE/app/build.gradle.kts" "$JARVIS_APP_ID" "$GITHUB_RUN_NUMBER" <<'PY'
          from pathlib import Path
          import sys
          gradle_file = Path(sys.argv[1])
          app_id = sys.argv[2]
          run_number = int(sys.argv[3])
          content = gradle_file.read_text()
          content = content.replace('applicationId = "com.jarvis.android"', f'applicationId = "{app_id}"', 1)
          content = __import__('re').sub(r'versionCode = \d+', f'versionCode = {1000 + run_number}', content, count=1)
          gradle_file.write_text(content)
          PY
          if [ "$JARVIS_SIGNING_MODE" = "preview" ]; then
            sed -i 's/android:label="Jarvis AI"/android:label="Jarvis AI Preview"/' "$DEST/AndroidManifest.xml"
          fi

          CMAKE_FILE="$BASE/lib/src/main/cpp/CMakeLists.txt"
          sed -i 's/set(GGML_CPU_KLEIDIAI ON)/set(GGML_CPU_KLEIDIAI OFF)/' "$CMAKE_FILE"
          sed -i 's/set(GGML_OPENMP ON)/set(GGML_OPENMP OFF)/' "$CMAKE_FILE"
          sed -i 's/arguments += "-DGGML_BACKEND_DL=ON"/arguments += "-DGGML_BACKEND_DL=OFF"/' "$BASE/lib/build.gradle.kts"
          sed -i 's/arguments += "-DGGML_CPU_ALL_VARIANTS=ON"/arguments += "-DGGML_CPU_ALL_VARIANTS=OFF"/' "$BASE/lib/build.gradle.kts"
          sed -i 's/arguments += "-DGGML_OPENMP=ON"/arguments += "-DGGML_OPENMP=OFF"/' "$BASE/lib/build.gradle.kts"
          sed -i 's/arguments += "-DGGML_CPU_KLEIDIAI=ON"/arguments += "-DGGML_CPU_KLEIDIAI=OFF"/' "$BASE/lib/build.gradle.kts"
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("arm64-v8a")/' "$BASE/lib/build.gradle.kts"

          test -f "$DEST/java/com/jarvis/android/EmbeddedLocalModel.kt"
          test -f "$DEST/java/com/jarvis/android/JarvisEngine.kt"
          test -f "$DEST/java/com/jarvis/android/JarvisWakeWordService.kt"
          test -f "$DEST/java/com/jarvis/android/OwnerVoiceProfile.kt"
          test -f "$DEST/assets/Qwen3-0.6B-Q4_K_M.gguf"
          test -f "$DEST/assets/jarvis-wake/am/final.mdl"
          test -f "$DEST/assets/jarvis-wake/conf/model.conf"
          for f in mfcc.conf final.ext.raw mean.vec transform.mat; do test -f "$DEST/assets/jarvis-speaker/$f"; done
          grep -q 'implementation(project(":lib"))' "$BASE/app/build.gradle.kts"
          grep -q 'com.alphacephei:vosk-android:0.3.75@aar' "$BASE/app/build.gradle.kts"
          test -f "$DEST/assets/LICENSE-APACHE-2.0.txt"
          test -f "$DEST/assets/LICENSE-LLAMA-CPP.txt"
          test -f "$DEST/assets/LICENSE-VOSK-APACHE-2.0.txt"
          echo 'Jarvis source + native llama.cpp + Qwen3 0.6B + Vosk Hindi wake model + Vosk speaker model configured.'

      - name: Build APK with embedded model
        working-directory: ${{ env.LLAMA_ANDROID_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain :app:clean :app:assembleDebug

      # Use one private signing key stored in GitHub Actions secrets. Without this,
      # each fresh GitHub runner creates a different debug certificate and Android
      # can reject updates over an already-installed Jarvis build.
      - name: Sign APK with persistent Jarvis key
        shell: bash
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="$LLAMA_ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          if [ "$JARVIS_SIGNING_MODE" = "preview" ]; then
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
            echo "Preview APK uses Gradle's debug signing key and package id $JARVIS_APP_ID; it installs beside the current app."
            exit 0
          fi

          for name in JARVIS_KEYSTORE_BASE64 JARVIS_KEYSTORE_PASSWORD JARVIS_KEY_ALIAS JARVIS_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Actions secret $name is missing."
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/jarvis-release.jks"
          ALIGNED="$RUNNER_TEMP/Jarvis-aligned.apk"
          SIGNED="$RUNNER_TEMP/Jarvis-signed.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED" "$SIGNED"' EXIT

          printf '%s' "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          test -f "$APK"

          # Align first, then sign. Do not modify the APK after signing.
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$JARVIS_KEY_ALIAS" \
            --ks-pass env:JARVIS_KEYSTORE_PASSWORD \
            --key-pass env:JARVIS_KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          "$BUILD_TOOLS/zipalign" -c 4 "$SIGNED"
          mv "$SIGNED" "$APK"
          echo "APK signed with the persistent Jarvis signing certificate."

      - name: Verify APK contains model and native inference library
        shell: bash
        run: |
          set -euo pipefail
          APK="$LLAMA_ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APK_SIZE=$(stat -c%s "$APK")
          echo "APK bytes: $APK_SIZE"
          test "$APK_SIZE" -gt 300000000 || { echo 'ERROR: APK is too small; bundled model may be missing'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "name='$JARVIS_APP_ID'"
          unzip -l "$APK" | grep -q 'assets/Qwen3-0.6B-Q4_K_M.gguf'
          unzip -l "$APK" | grep -q 'assets/jarvis-wake/am/final.mdl'
          unzip -l "$APK" | grep -q 'assets/jarvis-wake/conf/model.conf'
          unzip -l "$APK" | grep -q 'assets/jarvis-speaker/mfcc.conf'
          unzip -l "$APK" | grep -q 'assets/jarvis-speaker/final.ext.raw'
          unzip -l "$APK" | grep -q 'assets/jarvis-speaker/mean.vec'
          unzip -l "$APK" | grep -q 'assets/jarvis-speaker/transform.mat'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libai-chat.so'
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          cp "$APK" "$GITHUB_WORKSPACE/release-assets/Jarvis-Embedded-Qwen3-0.6B.apk"
          cp "$LLAMA_CPP_ROOT/LICENSE" "$GITHUB_WORKSPACE/release-assets/LICENSE-LLAMA-CPP.txt"
          cp "$LLAMA_ANDROID_DIR/app/src/main/assets/LICENSE-APACHE-2.0.txt" "$GITHUB_WORKSPACE/release-assets/LICENSE-APACHE-2.0.txt"
          cp "$LLAMA_ANDROID_DIR/app/src/main/assets/LICENSE-VOSK-APACHE-2.0.txt" "$GITHUB_WORKSPACE/release-assets/LICENSE-VOSK-APACHE-2.0.txt"
          cp "$LLAMA_ANDROID_DIR/app/src/main/assets/THIRD-PARTY-NOTICES.txt" "$GITHUB_WORKSPACE/release-assets/THIRD-PARTY-NOTICES.txt"
          sha256sum "$GITHUB_WORKSPACE/release-assets/Jarvis-Embedded-Qwen3-0.6B.apk" > "$GITHUB_WORKSPACE/release-assets/SHA256SUMS.txt"
          echo "APK contains Qwen3 GGUF, Vosk Hindi wake model and native inference library; package id: $JARVIS_APP_ID; signing mode: $JARVIS_SIGNING_MODE."

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jarvis Embedded AI Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Jarvis Android APK with Qwen3-0.6B Q4_K_M local text inference, llama.cpp, Hindi offline wake-word model, Vosk speaker-vector model for experimental owner voice matching, deterministic command routing, app launching, phone lock action (when Accessibility is enabled), and best-effort message drafting with explicit send confirmation.

            Message automation depends on app UI labels and Accessibility settings; recipients must be checked on screen and successful delivery is not guaranteed. The owner voice feature is an experimental similarity filter for hands-free commands, not secure identity proof; replayed audio or imitation may fool it, and false rejections are possible until threshold tests are completed on the target phone. It cannot unlock the Android device by voice. The Android system lock remains in control.

            Install mode: ${{ inputs.install_mode || 'auto (persistent key if configured, otherwise preview)' }}. Preview mode uses package id com.jarvis.android.preview and Gradle debug signing, so it installs alongside the existing app instead of replacing it. Update mode retains package id com.jarvis.android and requires all four JARVIS signing secrets to match the currently installed app's signing certificate exactly. Do not uninstall the existing app to solve a signature mismatch.

            APK is roughly half a gigabyte, depending on native-library compression. First launch copies Qwen3 and the wake model into private app storage, so keep around 1.5 GB free. The always-listening microphone is opt-in in Settings and uses extra battery. Image understanding still requires a configured vision-capable online or external model. Preview/update builds are not device-tested by the workflow.

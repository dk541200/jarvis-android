name: Build JARVIS APK
on:
  push:
    branches: [jarvis-rebuild]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "com.jarvis.android.preview"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-Preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-rebuild-preview
          name: JARVIS Rebuild Preview
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true

name: Build Jarvis Local AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME/cmdline-tools" \
              -maxdepth 3 \
              -type f \
              | head -50
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AAPT=$ANDROID_HOME/build-tools/36.0.0/aapt" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;29.0.13113456"

      - name: Download official llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

          test -f \
            /tmp/llama.cpp/examples/llama.android/gradlew

          test -d \
            /tmp/llama.cpp/examples/llama.android/lib

          echo "Official llama.cpp downloaded successfully."

      - name: Download bundled Jarvis GGUF model
        shell: bash
        run: |
          set -e

          MODEL_NAME="Llama-3.2-1B-Instruct-Q4_0.gguf"
          MODEL="/tmp/$MODEL_NAME"

          echo "Downloading bundled Llama 3.2 1B Q4_0 model..."

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            -o "$MODEL" \
            "https://huggingface.co/gaianet/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_0.gguf"

          test -f "$MODEL"

          SIZE=$(stat -c%s "$MODEL")

          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 700000000 ]; then
            echo "ERROR: GGUF model download appears incomplete."
            exit 1
          fi

          echo "GGUF model download successful."

      - name: Extract Jarvis source ZIP
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/jarvis-github-final.zip"
          EXTRACT="/tmp/jarvis-source"

          echo "Checking Jarvis source ZIP..."

          test -f "$ZIP"

          rm -rf "$EXTRACT"
          mkdir -p "$EXTRACT"

          unzip -q "$ZIP" -d "$EXTRACT"

          echo "ZIP extracted."

          echo "Searching for Jarvis MainActivity..."

          MAIN_FILE="$(find "$EXTRACT" \
            -type f \
            -path "*/com/jarvis/android/MainActivity.kt" \
            -print \
            -quit)"

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt not found."

            echo "ZIP contents:"
            find "$EXTRACT" \
              -maxdepth 8 \
              -type f \
              | head -150

            exit 1
          fi

          echo "MainActivity found:"
          echo "$MAIN_FILE"

          MAIN_DIR="$(dirname "$MAIN_FILE")"

          SRC="$(dirname \
            "$(dirname \
              "$(dirname \
                "$(dirname \
                  "$(dirname "$MAIN_DIR")"
                )"
              )"
            )"
          )"

          echo "Detected source directory:"
          echo "$SRC"

          test -f "$SRC/AndroidManifest.xml"
          test -f "$SRC/java/com/jarvis/android/MainActivity.kt"
          test -f "$SRC/java/com/jarvis/android/JarvisService.java"

          echo "Jarvis source structure verified."

          echo "$SRC" > /tmp/jarvis-src-path.txt

      - name: Inject Jarvis source into official llama.cpp
        shell: bash
        run: |
          set -e

          SRC="$(cat /tmp/jarvis-src-path.txt)"
          DEST="/tmp/llama.cpp/examples/llama.android/app"

          echo "Source:"
          echo "$SRC"

          echo "Destination:"
          echo "$DEST"

          rm -rf \
            "$DEST/src/main/java" \
            "$DEST/src/main/kotlin" \
            "$DEST/src/main/res" \
            "$DEST/src/main/assets"

          mkdir -p \
            "$DEST/src/main/java" \
            "$DEST/src/main/res" \
            "$DEST/src/main/assets"

          cp -R \
            "$SRC/java/." \
            "$DEST/src/main/java/"

          if [ -d "$SRC/res" ]; then
            cp -R \
              "$SRC/res/." \
              "$DEST/src/main/res/"
          fi

          if [ -d "$SRC/assets" ]; then
            cp -R \
              "$SRC/assets/." \
              "$DEST/src/main/assets/"
          fi

          cp \
            "$SRC/AndroidManifest.xml" \
            "$DEST/src/main/AndroidManifest.xml"

          echo "Jarvis source injected successfully."

      - name: Bundle Llama model into APK
        shell: bash
        run: |
          set -e

          DEST="/tmp/llama.cpp/examples/llama.android/app"
          MODEL="/tmp/Llama-3.2-1B-Instruct-Q4_0.gguf"

          mkdir -p "$DEST/src/main/assets"

          cp \
            "$MODEL" \
            "$DEST/src/main/assets/Llama-3.2-1B-Instruct-Q4_0.gguf"

          test -f \
            "$DEST/src/main/assets/Llama-3.2-1B-Instruct-Q4_0.gguf"

          SIZE=$(stat -c%s \
            "$DEST/src/main/assets/Llama-3.2-1B-Instruct-Q4_0.gguf")

          echo "Bundled model size: $SIZE bytes"

          if [ "$SIZE" -lt 700000000 ]; then
            echo "ERROR: Bundled model is incomplete."
            exit 1
          fi

          echo "Model bundled successfully."

      - name: Verify Jarvis source
        shell: bash
        run: |
          set -e

          MAIN="/tmp/llama.cpp/examples/llama.android/app/src/main"

          echo "Checking Jarvis package..."

          grep -R \
            "package com.jarvis.android" \
            "$MAIN/java/com/jarvis/android"

          echo "Checking AI library imports..."

          grep -R \
            "import com.arm.aichat" \
            "$MAIN/java/com/jarvis/android"

          echo "Checking legacy package..."

          if grep -R \
            "com.example.llama.aichat" \
            "$MAIN" >/dev/null 2>&1; then

            echo "ERROR: legacy package found."

            grep -R -n \
              "com.example.llama.aichat" \
              "$MAIN"

            exit 1
          fi

          echo "Checking bundled model..."

          test -f \
            "$MAIN/assets/Llama-3.2-1B-Instruct-Q4_0.gguf"

          echo "Checking Jarvis files..."

          test -f \
            "$MAIN/java/com/jarvis/android/MainActivity.kt"

          test -f \
            "$MAIN/java/com/jarvis/android/JarvisService.java"

          test -f \
            "$MAIN/AndroidManifest.xml"

          echo "All Jarvis source checks passed."

      - name: Configure application ID
        shell: bash
        run: |
          set -e

          GRADLE_FILE="/tmp/llama.cpp/examples/llama.android/app/build.gradle.kts"

          python3 - <<'PY'
          import re

          path = "/tmp/llama.cpp/examples/llama.android/app/build.gradle.kts"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.jarvis.android"',
              text,
              count=1
          )

          text = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.jarvis.android"',
              text,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo "Final namespace/applicationId:"

          grep -n \
            -E "namespace|applicationId" \
            "$GRADLE_FILE"

      - name: Verify bundled model before build
        shell: bash
        run: |
          set -e

          MODEL="/tmp/llama.cpp/examples/llama.android/app/src/main/assets/Llama-3.2-1B-Instruct-Q4_0.gguf"

          test -f "$MODEL"

          SIZE=$(stat -c%s "$MODEL")

          echo "Final APK model size: $SIZE bytes"

          if [ "$SIZE" -lt 700000000 ]; then
            echo "ERROR: Model is too small."
            exit 1
          fi

          echo "Final model verification passed."

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find \
            /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          test -f "$APK"

          echo "APK found:"
          echo "$APK"

          echo "Checking package ID..."

          "$AAPT" dump badging "$APK" \
            | grep -q "name='com.jarvis.android'"

          "$AAPT" dump badging "$APK" \
            | grep "^package:"

          echo "Checking APK size..."

          APK_SIZE=$(stat -c%s "$APK")

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 500000000 ]; then
            echo "WARNING: APK is unexpectedly small."
          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/release"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk"

          echo "APK verification passed."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          TAG="jarvis-build-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create \
            "$TAG" \
            "$GITHUB_WORKSPACE/release/Jarvis-Local-AI.apk" \
            --repo "${{ github.repository }}" \
            --title "Jarvis Local AI APK #${{ github.run_number }}" \
            --notes "Jarvis Local AI APK with bundled Llama 3.2 1B Q4_0. Package ID: com.jarvis.android."

          echo "GitHub Release created successfully."

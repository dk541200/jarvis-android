name: Build Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Clone official llama.cpp
        run: |
          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

      - name: Copy Jarvis source
        run: |
          rm -rf /tmp/llama.cpp/examples/llama.android/app/src/main
          mkdir -p /tmp/llama.cpp/examples/llama.android/app/src/main
          cp -R app/src/main/. \
            /tmp/llama.cpp/examples/llama.android/app/src/main/

      - name: Configure Jarvis package
        working-directory: /tmp/llama.cpp/examples/llama.android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'namespace = "com.arm.aichat"',
              'namespace = "com.jarvis.android"'
          )

          s = s.replace(
              'applicationId = "com.arm.aichat"',
              'applicationId = "com.jarvis.android"'
          )

          p.write_text(s)
          PY

      - name: Build Jarvis APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

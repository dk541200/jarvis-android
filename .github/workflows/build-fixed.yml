name: Build Jarvis APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jarvis Local AI APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      # 5. Download official llama.cpp
      - name: Download llama.cpp
        shell: bash
        run: |
          set -e

          rm -rf /tmp/llama.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            /tmp/llama.cpp

      # 6. Inject Jarvis source
      - name: Inject Jarvis source
        shell: bash
        run: |
          set -e

          JARVIS_MAIN="/tmp/llama.cpp/examples/llama.android/app/src/main"

          rm -rf "$JARVIS_MAIN"

          mkdir -p "$JARVIS_MAIN"

          cp -R \
            app/src/main/. \
            "$JARVIS_MAIN/"

      # 7. Configure Android package
      - name: Configure Jarvis package
        shell: bash
        working-directory: /tmp/llama.cpp/examples/llama.android
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("app/build.gradle.kts")

          if not gradle_file.exists():
              raise SystemExit(
                  "ERROR: app/build.gradle.kts was not found."
              )

          text = gradle_file.read_text()

          # Fix namespace
          text = text.replace(
              'namespace = "com.arm.aichat"',
              'namespace = "com.jarvis.android"'
          )

          # Fix application ID
          text = text.replace(
              'applicationId = "com.arm.aichat"',
              'applicationId = "com.jarvis.android"'
          )

          # If namespace is missing, add it
          if 'namespace = "com.jarvis.android"' not in text:
              text = text.replace(
                  "android {",
                  'android {\n    namespace = "com.jarvis.android"',
                  1
              )

          # If applicationId is missing, add it
          if 'applicationId = "com.jarvis.android"' not in text:
              text = text.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        applicationId = "com.jarvis.android"',
                  1
              )

          gradle_file.write_text(text)

          print("Jarvis package configured successfully.")
          PY

      # 8. Show build configuration
      - name: Verify project
        shell: bash
        working-directory: /tmp/llama.cpp/examples/llama.android
        run: |
          echo "===== Gradle file ====="
          cat app/build.gradle.kts

          echo ""
          echo "===== Jarvis source ====="
          find app/src/main -type f

      # 9. Build APK
      - name: Build Jarvis Debug APK
        shell: bash
        working-directory: /tmp/llama.cpp/examples/llama.android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 10. Find generated APK
      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find /tmp/llama.cpp/examples/llama.android/app/build \
            -type f \
            -name "*.apk" \
            -print

      # 11. Upload APK
      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

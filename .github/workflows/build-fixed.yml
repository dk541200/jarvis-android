name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Find Jarvis ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'jarvis*.zip' -print | sort | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No jarvis*.zip found in repository root."
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Jarvis source
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q -o "$ZIP_FILE" -d project

          APP_MANIFEST="$(find project -type f -path '*/app/src/main/AndroidManifest.xml' -print -quit)"
          if [ -z "$APP_MANIFEST" ]; then
            echo "ERROR: app/src/main/AndroidManifest.xml not found."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          APP_DIR="${APP_MANIFEST%/src/main/AndroidManifest.xml}"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Found Jarvis app: $APP_DIR"

      - name: Clone official llama.cpp Android project
        shell: bash
        run: |
          set -e
          rm -rf /tmp/llama.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          test -f /tmp/llama.cpp/examples/llama.android/gradlew
          test -d /tmp/llama.cpp/examples/llama.android/lib

      - name: Inject Jarvis into llama Android project
        shell: bash
        run: |
          set -e

          SRC="$GITHUB_WORKSPACE/$APP_DIR/src/main"
          DST="/tmp/llama.cpp/examples/llama.android/app"

          rm -rf "$DST/src/main/java"
          rm -rf "$DST/src/main/res"
          rm -f "$DST/src/main/AndroidManifest.xml"

          mkdir -p "$DST/src/main/java"
          mkdir -p "$DST/src/main/res"

          cp -R "$SRC/java/." "$DST/src/main/java/"
          cp -R "$SRC/res/." "$DST/src/main/res/"
          cp "$SRC/AndroidManifest.xml" "$DST/src/main/AndroidManifest.xml"

          sed -i 's/namespace = "com\.example\.llama"/namespace = "com.jarvis.android"/' \
            "$DST/build.gradle.kts"

          sed -i 's/applicationId = "com\.example\.llama\.aichat"/applicationId = "com.jarvis.android"/' \
            "$DST/build.gradle.kts"

          echo "Final Android build file:"
          cat "$DST/build.gradle.kts"

      - name: Build debug APK
        working-directory: /tmp/llama.cpp/examples/llama.android
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e
          find /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug \
            -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: /tmp/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
